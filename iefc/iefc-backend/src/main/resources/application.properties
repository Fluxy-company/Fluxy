spring.application.name=iefc-backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://iefc-db:5432/iefc_db
spring.datasource.username=maria
spring.datasource.password=Urubu100
spring.sql.init.mode=ALWAYS
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#caminho chave publica e privada jwt
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.relatorio.email.destinatario=${RELATORIO_EMAIL_DESTINATARIO:admin@iefc.org.br}