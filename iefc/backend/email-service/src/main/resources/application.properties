server.port=8080

spring.application.name=email-service

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${EMAIL_DATABASE_HOST:email-db}:5432/${EMAIL_DATABASE_NAME:email_db}
spring.datasource.username=${EMAIL_DATABASE_USERNAME}
spring.datasource.password=${EMAIL_DATABASE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAILTRAP_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.email.remetente-padrao=${EMAIL_REMETENTE_PADRAO:no-reply@iefc.org.br}
app.email.max-tentativas=${EMAIL_MAX_TENTATIVAS:5}
app.email.scheduler.fixed-delay-ms=${EMAIL_SCHEDULER_DELAY_MS:15000}
app.email.scheduler.batch-size=${EMAIL_SCHEDULER_BATCH_SIZE:20}
app.email.async.core-pool-size=${EMAIL_ASYNC_CORE_POOL_SIZE:2}
app.email.async.max-pool-size=${EMAIL_ASYNC_MAX_POOL_SIZE:5}
app.email.async.queue-capacity=${EMAIL_ASYNC_QUEUE_CAPACITY:200}
app.security.api-key=${EMAIL_SERVICE_API_KEY}