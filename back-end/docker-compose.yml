services:
  iefc-db:
    image: postgres
    container_name: iefc_container
    environment:
      POSTGRES_PASSWORD: ${IEFC_DATABASE_PASSWORD}
      POSTGRES_USER: ${IEFC_DATABASE_USERNAME}
      POSTGRES_DB: ${IEFC_DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - iefc-db-data:/var/lib/postgresql/data
    networks:
      - app-network
  fluxy-db:
    image: postgres
    container_name: fluxy_container
    environment:
      POSTGRES_PASSWORD: ${FLUXY_DATABASE_PASSWORD}
      POSTGRES_USER: ${FLUXY_DATABASE_USERNAME}
      POSTGRES_DB: ${FLUXY_DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - fluxy-db-data:/var/lib/postgresql/data
    networks:
      - app-network
  iefc-api:
    container_name: iefc_backend
    build:
      context: ./iefc-backend
      dockerfile: Dockerfile
    ports:
      - ${IEFC_APP_PORT}:8080
    volumes:
      - ./iefc-backend:/app
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - iefc-db
    networks:
      - app-network
  fluxy-api:
    container_name: fluxy-backend
    build:
      context: ./fluxy-backend
      dockerfile: Dockerfile
    ports:
      - ${FLUXY_APP_PORT}:8080
    volumes:
      - ./fluxy-backend:/app
    env_file:
      - .env
    depends_on:
      - fluxy-db
    networks:
      - app-network
volumes:
  iefc-db-data:
  fluxy-db-data:

networks:
  app-network:
    driver: bridge
